<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <defs>
    <linearGradient id="dogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5d4a28;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#9c7a3b;stop-opacity:0.85"/>
    </linearGradient>
  </defs>
  <!-- Dog silhouette -->
  <g fill="url(#dogGrad)">
    <!-- Body -->
    <ellipse cx="100" cy="115" rx="55" ry="35"/>
    <!-- Head -->
    <circle cx="145" cy="75" r="28"/>
    <!-- Snout -->
    <ellipse cx="168" cy="82" rx="15" ry="10"/>
    <!-- Left ear -->
    <path d="M125,55 Q120,25 135,50" fill="url(#dogGrad)" stroke="none"/>
    <ellipse cx="128" cy="42" rx="8" ry="15" transform="rotate(-15,128,42)"/>
    <!-- Right ear -->
    <path d="M155,55 Q160,25 165,50" fill="url(#dogGrad)" stroke="none"/>
    <ellipse cx="158" cy="42" rx="8" ry="15" transform="rotate(15,158,42)"/>
    <!-- Tail -->
    <path d="M45,105 Q20,70 35,55" stroke="url(#dogGrad)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Front legs -->
    <rect x="120" y="135" width="12" height="30" rx="5"/>
    <rect x="138" y="135" width="12" height="30" rx="5"/>
    <!-- Back legs -->
    <rect x="65" y="135" width="12" height="30" rx="5"/>
    <rect x="83" y="135" width="12" height="30" rx="5"/>
    <!-- Paws -->
    <ellipse cx="126" cy="167" rx="8" ry="5"/>
    <ellipse cx="144" cy="167" rx="8" ry="5"/>
    <ellipse cx="71" cy="167" rx="8" ry="5"/>
    <ellipse cx="89" cy="167" rx="8" ry="5"/>
  </g>
  <!-- Eye -->
  <circle cx="152" cy="72" r="4" fill="#fdf8ed"/>
  <circle cx="153" cy="71" r="2" fill="#2c2416"/>
  <!-- Nose -->
  <ellipse cx="180" cy="80" rx="5" ry="4" fill="#2c2416"/>
  <!-- Collar -->
  <path d="M125,95 Q145,105 165,95" stroke="#c8a76c" stroke-width="4" fill="none"/>
  <!-- Collar tag -->
  <circle cx="145" cy="103" r="5" fill="#c8a76c"/>
</svg>
